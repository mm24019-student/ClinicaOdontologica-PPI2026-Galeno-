<?xml version='1.0' encoding='UTF-8' ?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition template="/WEB-INF/general.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud">

    <ui:define name="titulo_pagina">
        <h2>Consulta</h2>
    </ui:define>


    <ui:define name="contenido">

        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{consultaModel}"
                             var="r"
                             id="tblConsulta"
                             paginator="true"
                             rows="10"  style="width:100%"   selectionMode="single"  rowKey="#{r.idConsulta}" rendered="#{consultaModel.estado=='NINGUNO'}">

                    <p:ajax event="rowSelect"
                            listener="#{consultaModel.onRowSelect}"
                            update=":frmTabla :Consulta :mensajes"/>

                    <p:column headerText="Inicio">
                        <h:outputText value="#{r.fechaInicio}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Fin">
                        <h:outputText value="#{r.fechaFin}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Referencia externa">
                        <h:outputText value="#{r.referenciaExterna}"/>
                    </p:column>
                    <p:column headerText="Persona / Rol">
                        <h:outputText value="#{consultaModel.etiquetaPersonaRol(r.idPersonaRol)}"/>
                    </p:column>
                </p:dataTable>
             
                <g:Botones_Acciones modelo="#{consultaModel}"/>
            </h:form>
        </div>

        <!-- MENSAJES-->

        <div class="mensajes">
            <p:messages id="mensajes"  globalOnly="false" showDetail="true" showSummary="false" closable="true"/>
        </div>

        <!-- FORMULARIO PRINCIPAL DE CONSULTA-->
        <div class="tarjeta-suelta">
            <h2>Mantenimiento Consulta</h2>
            <h:form id="Consulta"
                    styleClass="form-consulta">
                <p:tabView id="tabsConsulta" binding="#{consultaModel.tabView}"
                           widgetVar="tabsConsulta" activeIndex="#{consultaModel.activo}"
                           rendered="#{consultaModel.estado!='NINGUNO'}">

                    <!-- Un solo listener para las 3 pestañas: decide qué recargar
                         según el título de la pestaña a la que se entró, en vez
                         de recargar los dos hijos en cada cambio de pestaña
                         (lo que pisaba el estado del otro). -->
                    <p:ajax event="tabChange"
                            listener="#{consultaModel.onTabChange}"
                            update=":Consulta:tabsConsulta:pnlProcedimientos :Consulta:tabsConsulta:pnlPasosConsultaProcedimiento"/>
                    <!-- PESTAÑA 1: DATOS DE LA CONSULTA -->
                    <p:tab title="Datos de la Consulta">
                        <h:panelGroup id="pnlDatosConsulta">
                            <p:panelGrid columns="2">
                                <p:outputLabel value="Fecha de inicio"
                                               for="dtInicioConsulta"/>
                                <p:datePicker id="dtInicioConsulta"
                                              value="#{consultaModel.registro.fechaInicio}"
                                              showTime="true"
                                              pattern="dd/MM/yyyy HH:mm"
                                              showIcon="true"/>
                                <p:outputLabel value="Fecha de fin"
                                               for="dtFinConsulta"/>
                                <p:datePicker id="dtFinConsulta"
                                              value="#{consultaModel.registro.fechaFin}"
                                              showTime="true"
                                              pattern="dd/MM/yyyy HH:mm"
                                              showIcon="true"/>
                                <p:outputLabel value="Referencia externa"
                                               for="txtReferenciaConsulta"/>
                                <p:inputText id="txtReferenciaConsulta"
                                             size="40"
                                             value="#{consultaModel.registro.referenciaExterna}"/>
                                <p:outputLabel value="Persona / Rol" for="acPersonaRolConsulta"/>
                                <p:autoComplete id="acPersonaRolConsulta"
                                                value="#{consultaModel.personaRolSeleccionado}"
                                                completeMethod="#{consultaModel.completarPersonasRol}"
                                                var="pr"
                                                itemValue="#{pr}" itemLabel="#{consultaModel.etiquetaPersonaRol(pr)}" converter="personaRolConverter"  forceSelection="true"  required="true"  requiredMessage="Seleccione la persona y su rol"  placeholder="Buscar persona o rol..."   style="width:100%;">
                                </p:autoComplete>
                                <p:outputLabel value="Observaciones"
                                               for="txtObservacionesConsulta"/>
                                <p:inputTextarea id="txtObservacionesConsulta"
                                                 rows="4"
                                                 cols="60"
                                                 value="#{consultaModel.registro.observaciones}"/>
                            </p:panelGrid>
                            <g:botones_top modelo="#{consultaModel}" process="@form"/>
                        </h:panelGroup>
                    </p:tab>
                    <!-- PESTAÑA 2: PROCEDIMIENTOS DE LA CONSULTA -->
                    <p:tab title="Procedimientos de la Consulta" 
                           disabled="#{consultaModel.estado!='MODIFICAR'}" >
                        <h:panelGroup id="pnlProcedimientos"  >
                            <!-- TABLA DE PROCEDIMIENTOS-->
                            <p:dataTable value="#{consultaProcedimientoModel}"
                                         var="ps"
                                         id="tblConsultaProcedimientos"
                                         paginator="true"
                                         rows="10"
                                         style="width:100%"
                                         selectionMode="single"
                                         rowKey="#{ps.idConsultaProcedimiento}"
                                         rendered="#{consultaProcedimientoModel.estado=='NINGUNO'}">

                                <p:ajax event="rowSelect"
                                        listener="#{consultaProcedimientoModel.onRowSelect}"
                                        update=":Consulta:tabsConsulta :mensajes" resetValues="true"/>

                                <p:column headerText="Procedimiento">
                                    <h:outputText
                                        value="#{consultaProcedimientoModel.nombreProcedimiento(ps.idProcedimiento)}"/>
                                </p:column>

                                <p:column headerText="Inicio">
                                    <h:outputText value="#{ps.fechaInicio}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Fin">
                                    <h:outputText value="#{ps.fechaFin}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Observaciones">
                                    <h:outputText value="#{ps.observaciones}"/>
                                </p:column>

                            </p:dataTable>
                            <!-- NUEVO PROCEDIMIENTO -->
                            <g:Botones_Acciones modelo="#{consultaProcedimientoModel}"
                                                mostrarCancelar="false" rendered="#{consultaProcedimientoModel.estado=='NINGUNO'}" />

                            <!-- FORMULARIO DEL PROCEDIMIENTO-->
                            <p:panelGrid columns="2" 
                                         rendered="#{consultaProcedimientoModel.estado!='NINGUNO'}">
                                <p:outputLabel value="Procedimiento" for="acProcedimientoConsulta"/>

                                <p:autoComplete id="acProcedimientoConsulta"
                                                value="#{consultaProcedimientoModel.procedimientoSeleccionado}"
                                                completeMethod="#{consultaProcedimientoModel.completarProcedimientos}"
                                                var="pr"
                                                itemValue="#{pr}"
                                                itemLabel="#{pr.nombre}"
                                                converter="procedimientoConverter"
                                                required="true"
                                                requiredMessage="Seleccione el procedimiento"
                                                placeholder="Buscar procedimiento..."
                                                style="width:100%;">
                                </p:autoComplete>
                                <p:outputLabel value="Fecha de inicio"
                                               for="dtInicioProcedimiento"/>
                                <p:datePicker id="dtInicioProcedimiento"
                                              value="#{consultaProcedimientoModel.registro.fechaInicio}"
                                              showTime="true"
                                              pattern="dd/MM/yyyy HH:mm"
                                              showIcon="true"/>
                                <p:outputLabel value="Fecha de fin"
                                               for="dtFinProcedimiento"/>
                                <p:datePicker id="dtFinProcedimiento"
                                              value="#{consultaProcedimientoModel.registro.fechaFin}"
                                              showTime="true" pattern="dd/MM/yyyy HH:mm" showIcon="true"/>
                                <p:outputLabel value="Observaciones"
                                               for="txtObservacionesProcedimiento"/>
                                <p:inputTextarea id="txtObservacionesProcedimiento" rows="4" cols="60"
                                                 value="#{consultaProcedimientoModel.registro.observaciones}"/>
                            </p:panelGrid>

                            <!-- BOTONES CRUD DEL PROCEDIMIENTO-->
                            <div class="pasos-botones" style="display:flex; align-items:center; gap:10px;">
                               <g:botones_top modelo="#{consultaProcedimientoModel}" process="@form"
                                           tabla="Consulta:tabsConsulta:pnlProcedimientos"
                                           rendered="#{consultaProcedimientoModel.estado!='NINGUNO'}"/>
                               <g:Botones_Acciones modelo="#{consultaProcedimientoModel}"
                                                   mostrarNuevo="false" rendered="#{consultaProcedimientoModel.estado!='NINGUNO'}" />
                            </div>
                        </h:panelGroup>
                    </p:tab>

                    <!-- PESTAÑA 3: PASOS DEL PROCEDIMIENTO SELECCIONADO EN LA PESTAÑA 2 -->
                    <!-- Solo tiene sentido una vez que hay un ConsultaProcedimiento
                         seleccionado/guardado (MODIFICAR en la pestaña 2), porque
                         un paso necesita un ConsultaProcedimiento ya existente. -->
                    <p:tab title="Pasos del Procedimiento" 
                           disabled="#{consultaProcedimientoModel.estado!='MODIFICAR'}">

                        <h:panelGroup id="pnlPasosConsultaProcedimiento" > 
                            <!-- TABLA DE PASOS -->
                            <p:dataTable value="#{consultaProcedimientoPasoModel}"
                                         var="cpp"
                                         id="tblPasosConsultaProcedimiento"
                                         paginator="true"
                                         rows="10"
                                         style="width:100%"
                                         selectionMode="single"
                                         rowKey="#{cpp.idConsultaProcedimientoPaso}"
                                         rendered="#{consultaProcedimientoPasoModel.estado=='NINGUNO'}">

                                <p:ajax event="rowSelect"
                                        listener="#{consultaProcedimientoPasoModel.onRowSelect}"
                                        update=":Consulta:tabsConsulta:pnlPasosConsultaProcedimiento :mensajes" resetValues="true"/>

                                <p:column headerText="Estado">
                                    <h:outputText value="#{cpp.estado}"/>
                                </p:column>

                                <p:column headerText="Persona / Rol">
                                    <h:outputText value="#{consultaProcedimientoPasoModel.etiquetaPersonaRol(cpp.idPersonaRol)}"/>
                                </p:column>

                                <p:column headerText="Inicio">
                                    <h:outputText value="#{cpp.fechaInicio}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                    </h:outputText>
                                </p:column>

                                <p:column headerText="Fin">
                                    <h:outputText value="#{cpp.fechaFin}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                    </h:outputText>
                                </p:column>
                            </p:dataTable>

                            <!-- NUEVO PASO -->
                             <g:Botones_Acciones modelo="#{consultaProcedimientoPasoModel}"
                       mostrarCancelar="false" rendered="#{consultaProcedimientoPasoModel.estado=='NINGUNO'}" />

                            <!-- FORMULARIO DEL PASO -->
                            <p:panelGrid columns="2"
                                         rendered="#{consultaProcedimientoPasoModel.estado!='NINGUNO'}">
                                <p:outputLabel value="Estado" for="selEstadoPaso"/>
                                <p:selectOneMenu id="selEstadoPaso"
                                                 value="#{consultaProcedimientoPasoModel.registro.estado}">
                                    <f:selectItems value="#{consultaProcedimientoPasoModel.estados}"/>
                                </p:selectOneMenu>

                                <p:outputLabel value="Persona / Rol" for="acPersonaRolPaso"/>
                                <p:autoComplete id="acPersonaRolPaso" required="true" requiredMessage="Seleccione una Persona/Rol"
                                                value="#{consultaProcedimientoPasoModel.registro.idPersonaRol}"
                                                completeMethod="#{consultaProcedimientoPasoModel.completarPersonasRol}"
                                                var="pr"
                                                itemValue="#{pr}"
                                                itemLabel="#{consultaProcedimientoPasoModel.etiquetaPersonaRol(pr)}"
                                                converter="personaRolConverter"
                                                forceSelection="true"
                                                placeholder="Buscar persona o rol..."
                                                style="width:100%;">
                                </p:autoComplete>

                                <p:outputLabel value="Fecha de inicio" for="dtInicioPaso"/>
                                <p:datePicker id="dtInicioPaso"
                                              value="#{consultaProcedimientoPasoModel.registro.fechaInicio}"
                                              showTime="true"
                                              pattern="dd/MM/yyyy HH:mm"
                                              showIcon="true"/>

                                <p:outputLabel value="Fecha de fin" for="dtFinPaso"/>
                                <p:datePicker id="dtFinPaso"
                                              value="#{consultaProcedimientoPasoModel.registro.fechaFin}"
                                              showTime="true"
                                              pattern="dd/MM/yyyy HH:mm"
                                              showIcon="true"/>
                            </p:panelGrid>

                            <!-- BOTONES CRUD DEL PASO -->
                             <div class="pasos-botones" style="display:flex; align-items:center; gap:10px;">
                                
                                 <g:botones_top modelo="#{consultaProcedimientoPasoModel}"/>
                                    <g:Botones_Acciones modelo="#{consultaProcedimientoPasoModel}"
                                mostrarNuevo="false" rendered="#{consultaProcedimientoPasoModel.estado!='NINGUNO'}" />
                            </div>
                            
                        </h:panelGroup>
                    </p:tab>
                </p:tabView>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
