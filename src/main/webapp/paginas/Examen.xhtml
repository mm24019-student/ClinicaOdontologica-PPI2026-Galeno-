<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/general.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud">

    <ui:define name="titulo_pagina">
        <h2>Examen</h2>
    </ui:define>

    <ui:define name="contenido">
        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{examenModel}" var="r" id="tblExamen"
                             paginator="true" rows="10" style="width:100%"
                             selectionMode="single" rowKey="#{r.idExamen}"
                             rendered="#{examenModel.estado=='NINGUNO'}">
                    <p:ajax event="rowSelect" listener="#{examenModel.onRowSelect}"
                            update=":frmTabla :Examen :mensajes"/>
                    <p:ajax event="rowSelect" listener="#{examenModel.seleccionarExamen}"
                            update=":Examen:tabsExamen:pnlDetalleTipo"/>
                    <p:column headerText="ID">
                        <p:outputLabel value="#{r.idExamen}" />
                    </p:column>
                    <p:column headerText="Nombre">
                        <p:outputLabel value="#{r.nombre}"/>
                    </p:column>
                    <p:column headerText="Estado">
                        <p:outputLabel value="#{r.activo?'ACTIVO':'INACTIVO'}"/>
                    </p:column>
                    <p:column headerText="Observaciones">
                        <p:outputLabel value="#{r.observaciones}"/>
                    </p:column>
                </p:dataTable>
                <p:commandButton value="#{msg['crud.boton.nuevo']}" actionListener="#{examenModel.btnNuevoHandler}"
                                 update=":frmTabla :Examen :mensajes"/>
                <p:commandButton value="#{msg['crud.boton.cancelar']}" actionListener="#{examenModel.btnCancelar()}"
                                 update=":frmTabla :Examen :mensajes"/>
            </h:form>
        </div>

        <div class="mensajes">
            <p:messages id="mensajes" globalOnly="false" showDetail="true" showSummary="true"
                        closable="true"/>
        </div>

        <div class="tarjeta-suelta">
            <h2>Mantenimiento de Examen</h2>
            <h:form id="Examen" styleClass="form-examen">

                <p:tabView id="tabsExamen" rendered="#{examenModel.estado!='NINGUNO'}">

                    <p:tab title="Datos generales">
                        <p:panelGrid columns="2">
                            <p:outputLabel value="ID" for="txtId"/>
                            <p:inputText id="txtId" size="70" disabled="true" value="#{examenModel.registro.idExamen}"/>
                            <p:outputLabel value="Nombre" for="txtNombre"/>
                            <p:inputText id="txtNombre" size="70" maxlength="255" value="#{examenModel.registro.nombre}"/>
                            <p:outputLabel for="chkActivo" value="Activo"/>
                            <p:selectBooleanCheckbox id="chkActivo" value="#{examenModel.registro.activo}"/>
                            <p:outputLabel for="txtObservaciones" value="Observaciones"/>
                            <p:inputTextarea id="txtObservaciones" rows="3" cols="70" value="#{examenModel.registro.observaciones}"/>
                        </p:panelGrid>
                        <g:botones_top modelo="#{examenModel}"/>
                    </p:tab>

                    <!-- Pestaña anidada: mini-CRUD de ExamenTipoExamen filtrado por este examen -->
                    <p:tab title="Tipos de Examen" disabled="#{examenModel.estado=='CREAR'}">
                        <h:panelGroup id="pnlDetalleTipo">

                            <p:dataTable id="tblExamenTipoExamenDetalle"
                                         value="#{examenTipoExamenModel}" var="d"
                                         rowKey="#{d.idExamenTipoExamen}"
                                         selectionMode="single"
                                         emptyMessage="Este examen no tiene tipos asociados todavía."
                                         rendered="#{examenTipoExamenModel.estado=='NINGUNO'}">
                                <p:ajax event="rowSelect" listener="#{examenTipoExamenModel.onRowSelect}"
                                        update=":Examen:tabsExamen:pnlDetalleTipo"/>
                                <p:column headerText="Tipo de examen">
                                    <p:outputLabel value="#{d.idTipoExamen.nombre}"/>
                                </p:column>
                                <p:column headerText="Fecha de creación">
                                    <h:outputText value="#{d.fechaCreacion}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="Observaciones">
                                    <p:outputLabel value="#{d.observaciones}"/>
                                </p:column>
                            </p:dataTable>

                            <p:commandButton value="Nuevo tipo" actionListener="#{examenTipoExamenModel.btnNuevoHandler}"
                                             update=":Examen:tabsExamen:pnlDetalleTipo :mensajes"
                                             rendered="#{examenTipoExamenModel.estado=='NINGUNO'}"/>

                            <!-- Formulario embebido: aparece solo cuando hay un registro en CREAR/MODIFICAR -->
                            <p:panelGrid columns="2" rendered="#{examenTipoExamenModel.estado!='NINGUNO'}">
                                <p:outputLabel value="Tipo de examen *" for="acTipoExamen"/>
                                <p:autoComplete id="acTipoExamen"
                                                 value="#{examenTipoExamenModel.registro.idTipoExamen}"
                                                 completeMethod="#{examenTipoExamenModel.completarTiposExamen}"
                                                 converter="#{tipoExamenConverter}"
                                                 var="t" itemLabel="#{t.nombre}" itemValue="#{t}"
                                                 forceSelection="true" minQueryLength="0"
                                                 placeholder="Escriba para buscar..."/>

                                <p:outputLabel value="Fecha de creación" for="calFechaTipo"/>
                                <p:datePicker id="calFechaTipo" showTime="true" pattern="dd/MM/yyyy HH:mm"
                                              timeZone="America/El_Salvador"
                                              value="#{examenTipoExamenModel.registro.fechaCreacion}"/>

                                <p:outputLabel value="Observaciones" for="txtObsTipo"/>
                                <p:inputTextarea id="txtObsTipo" rows="3" cols="50"
                                                  value="#{examenTipoExamenModel.registro.observaciones}"/>
                            </p:panelGrid>

                            <p:commandButton value="Guardar" actionListener="#{examenTipoExamenModel.btnCrearhandler}"
                                             rendered="#{examenTipoExamenModel.estado=='CREAR'}"
                                             update=":Examen:tabsExamen:pnlDetalleTipo :mensajes"/>
                            <p:commandButton value="Actualizar" actionListener="#{examenTipoExamenModel.btnModificarHandler}"
                                             rendered="#{examenTipoExamenModel.estado=='MODIFICAR'}"
                                             update=":Examen:tabsExamen:pnlDetalleTipo :mensajes"/>
                            <p:commandButton value="Eliminar" actionListener="#{examenTipoExamenModel.btnEliminarHandler}"
                                             rendered="#{examenTipoExamenModel.estado=='MODIFICAR'}"
                                             update=":Examen:tabsExamen:pnlDetalleTipo :mensajes"/>
                            <p:commandButton value="Cancelar" actionListener="#{examenTipoExamenModel.btnCancelar()}"
                                             rendered="#{examenTipoExamenModel.estado!='NINGUNO'}"
                                             update=":Examen:tabsExamen:pnlDetalleTipo :mensajes"/>

                        </h:panelGroup>
                    </p:tab>

                </p:tabView>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
