<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/general.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud">

    <ui:define name="titulo_pagina">
        <h2>Orden de Examen</h2>
    </ui:define>

    <ui:define name="contenido">
        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{ordenExamenModel}" var="r" id="tblOrdenExamen"
                             paginator="true" rows="10" style="width:100%"
                             selectionMode="single" rowKey="#{r.idOrdenExamen}"
                             rendered="#{ordenExamenModel.estado=='NINGUNO'}">
                    <p:ajax event="rowSelect" listener="#{ordenExamenModel.onRowSelect}"
                            update=":frmTabla :OrdenExamen :mensajes"/>
                    <p:ajax event="rowSelect" listener="#{ordenExamenModel.seleccionarOrdenExamen}"
                            update=":OrdenExamen:tabsOrden:pnlDetalleResultado"/>
                    <p:column headerText="ID">
                        <p:outputLabel value="#{r.idOrdenExamen}" />
                    </p:column>
                    <p:column headerText="Consulta (estado)">
                        <p:outputLabel value="#{r.idConsultaProcedimientoPaso.estado}"/>
                    </p:column>
                    <p:column headerText="Fecha de creación">
                        <h:outputText value="#{r.fechaCreacion}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Indicaciones">
                        <p:outputLabel value="#{r.indicaciones}"/>
                    </p:column>
                </p:dataTable>
                <p:commandButton value="#{msg['crud.boton.nuevo']}" actionListener="#{ordenExamenModel.btnNuevoHandler}"
                                 update=":frmTabla :OrdenExamen :mensajes"/>
                <p:commandButton value="#{msg['crud.boton.cancelar']}" actionListener="#{ordenExamenModel.btnCancelar()}"
                                 update=":frmTabla :OrdenExamen :mensajes"/>
            </h:form>
        </div>

        <div class="mensajes">
            <p:messages id="mensajes" globalOnly="false" showDetail="true" showSummary="true"
                        closable="true"/>
        </div>

        <div class="tarjeta-suelta">
            <h2>Mantenimiento de Orden de Examen</h2>
            <h:form id="OrdenExamen" styleClass="form-orden-examen">

                <p:tabView id="tabsOrden" rendered="#{ordenExamenModel.estado!='NINGUNO'}">

                    <p:tab title="Datos generales">
                        <p:panelGrid columns="2">
                            <p:outputLabel value="ID" for="txtId"/>
                            <p:inputText id="txtId" size="70" disabled="true" value="#{ordenExamenModel.registro.idOrdenExamen}"/>

                            <p:outputLabel value="Consulta (paso) *" for="acConsulta"/>
                            <p:autoComplete id="acConsulta"
                                             value="#{ordenExamenModel.registro.idConsultaProcedimientoPaso}"
                                             completeMethod="#{ordenExamenModel.completarPasosConsulta}"
                                             converter="#{consultaProcedimientoPasoConverter}"
                                             var="c" itemLabel="#{c.estado} - #{c.idConsultaProcedimientoPaso}" itemValue="#{c}"
                                             forceSelection="true" minQueryLength="0"
                                             placeholder="Escriba el estado o el ID...">
                                <p:ajax event="itemSelect" update="txtDescConsulta"/>
                                <p:ajax event="change" update="txtDescConsulta"/>
                            </p:autoComplete>

                            <p:outputLabel value="Detalle de la consulta"/>
                            <h:panelGroup id="txtDescConsulta">
                                <h:outputText value="#{ordenExamenModel.registro.idConsultaProcedimientoPaso.fechaInicio}" rendered="#{ordenExamenModel.registro.idConsultaProcedimientoPaso != null}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                                </h:outputText>
                            </h:panelGroup>

                            <p:outputLabel value="Fecha de creación" for="calFecha"/>
                            <p:datePicker id="calFecha" showTime="true" pattern="dd/MM/yyyy HH:mm"
                                          timeZone="America/El_Salvador"
                                          value="#{ordenExamenModel.registro.fechaCreacion}"/>

                            <p:outputLabel for="txtIndicaciones" value="Indicaciones"/>
                            <p:inputTextarea id="txtIndicaciones" rows="3" cols="70" value="#{ordenExamenModel.registro.indicaciones}"/>
                        </p:panelGrid>
                        <g:botones_top modelo="#{ordenExamenModel}"/>
                    </p:tab>

                    <!-- Pestaña anidada: resultados de esta orden -->
                    <p:tab title="Resultados" disabled="#{ordenExamenModel.estado=='CREAR'}">
                        <h:panelGroup id="pnlDetalleResultado">

                            <p:dataTable id="tblExamenResultadoDetalle"
                                         value="#{examenResultadoModel}" var="d"
                                         rowKey="#{d.idExamenResultado}"
                                         selectionMode="single"
                                         emptyMessage="Esta orden no tiene resultados registrados todavía."
                                         rendered="#{examenResultadoModel.estado=='NINGUNO'}">
                                <p:ajax event="rowSelect" listener="#{examenResultadoModel.onRowSelect}"
                                        update=":OrdenExamen:tabsOrden:pnlDetalleResultado"/>
                                <p:column headerText="Fecha de creación">
                                    <h:outputText value="#{d.fechaCreacion}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="Resultado">
                                    <p:outputLabel value="#{d.resultado}"/>
                                </p:column>
                                <p:column headerText="Interpretación">
                                    <p:outputLabel value="#{d.interpretacion}"/>
                                </p:column>
                            </p:dataTable>

                            <p:commandButton value="Nuevo resultado" actionListener="#{examenResultadoModel.btnNuevoHandler}"
                                             update=":OrdenExamen:tabsOrden:pnlDetalleResultado :mensajes"
                                             rendered="#{examenResultadoModel.estado=='NINGUNO'}"/>

                            <p:panelGrid columns="2" rendered="#{examenResultadoModel.estado!='NINGUNO'}">
                                <p:outputLabel value="Fecha de creación" for="calFechaResultado"/>
                                <p:datePicker id="calFechaResultado" showTime="true" pattern="dd/MM/yyyy HH:mm"
                                              timeZone="America/El_Salvador"
                                              value="#{examenResultadoModel.registro.fechaCreacion}"/>

                                <p:outputLabel value="Resultado" for="txtResultado"/>
                                <p:inputTextarea id="txtResultado" rows="3" cols="50" value="#{examenResultadoModel.registro.resultado}"/>

                                <p:outputLabel value="Interpretación" for="txtInterpretacion"/>
                                <p:inputTextarea id="txtInterpretacion" rows="3" cols="50" value="#{examenResultadoModel.registro.interpretacion}"/>

                                <p:outputLabel value="Ruta del atestado" for="txtRuta"/>
                                <p:inputText id="txtRuta" size="50" value="#{examenResultadoModel.registro.rutaAtestado}"/>
                            </p:panelGrid>

                            <p:commandButton value="Guardar" actionListener="#{examenResultadoModel.btnCrearhandler}"
                                             rendered="#{examenResultadoModel.estado=='CREAR'}"
                                             update=":OrdenExamen:tabsOrden:pnlDetalleResultado :mensajes"/>
                            <p:commandButton value="Actualizar" actionListener="#{examenResultadoModel.btnModificarHandler}"
                                             rendered="#{examenResultadoModel.estado=='MODIFICAR'}"
                                             update=":OrdenExamen:tabsOrden:pnlDetalleResultado :mensajes"/>
                            <p:commandButton value="Eliminar" actionListener="#{examenResultadoModel.btnEliminarHandler}"
                                             rendered="#{examenResultadoModel.estado=='MODIFICAR'}"
                                             update=":OrdenExamen:tabsOrden:pnlDetalleResultado :mensajes"/>
                            <p:commandButton value="Cancelar" actionListener="#{examenResultadoModel.btnCancelar()}"
                                             rendered="#{examenResultadoModel.estado!='NINGUNO'}"
                                             update=":OrdenExamen:tabsOrden:pnlDetalleResultado :mensajes"/>

                        </h:panelGroup>
                    </p:tab>

                </p:tabView>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
