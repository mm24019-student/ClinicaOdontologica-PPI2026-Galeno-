<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/general.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud">

    <ui:define name="titulo_pagina">
        <h2>Persona</h2>
    </ui:define>

    <ui:define name="contenido">

        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{personaModel}" var="r" id="tblPersona"
                             paginator="true" rows="10" style="width:100%"
                             selectionMode="single" rowKey="#{r.idPersona}"
                             rendered="#{personaModel.estado=='NINGUNO'}">
                    <p:ajax event="rowSelect" listener="#{personaModel.onRowSelect}"
                            update=":frmTabla :Persona :mensajes" resetValues="true"/>
                    <p:column headerText="Nombres">
                        <p:outputLabel value="#{r.nombres}"/>
                    </p:column>
                    <p:column headerText="Apellidos">
                        <p:outputLabel value="#{r.apellidos}"/>
                    </p:column>
                    <p:column headerText="Fecha de Nacimiento">
                        <h:outputText value="#{r.fechaNacimiento}">
                            <f:convertDateTime pattern="dd/MM/yyyy" timeZone="America/El_Salvador"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Fecha de Creación">
                        <h:outputText value="#{r.fechaCreacion}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>

                <p:commandButton value="#{msg['crud.boton.nuevo']}" style="margin-right:10px;" resetValues="true"
                                 actionListener="#{personaModel.btnNuevoHandler}"
                                 update=":frmTabla :Persona :mensajes"/>
                <p:commandButton value="#{msg['crud.boton.cancelar']}" resetValues="true"
                                 actionListener="#{personaModel.btnCancelar}"
                                 update=":frmTabla :Persona :mensajes"/>
            </h:form>
        </div>

        <div class="mensajes">
            <p:messages id="mensajes" globalOnly="false" showDetail="true" showSummary="true"
                        closable="true"/>
        </div>

        <div class="tarjeta-suelta">
            <h2>Mantenimiento de Persona</h2>
            <h:form id="Persona" styleClass="form-persona">
                <p:panelGrid columns="2" style="width:100%" rendered="#{personaModel.estado!='NINGUNO'}">
                    <p:outputLabel value="ID" for="txtId"/>
                    <p:inputText id="txtId" style="width:100%" disabled="true" value="#{personaModel.registro.idPersona}"/>
                    <p:outputLabel value="Nombres" for="txtNombres"/>
                    <p:inputText id="txtNombres" style="width:100%" value="#{personaModel.registro.nombres}"/>
                    <p:outputLabel value="Apellidos" for="txtApellidos"/>
                    <p:inputText id="txtApellidos" style="width:100%" value="#{personaModel.registro.apellidos}"/>
                    <p:outputLabel for="calFechaNacimiento" value="Fecha de Nacimiento"/>
                    <p:datePicker id="calFechaNacimiento" style="width:100%" pattern="dd/MM/yyyy"
                                  value="#{personaModel.registro.fechaNacimiento}" showIcon="true"
                                  monthNavigator="true" yearNavigator="true" yearRange="1900:2026"/>
                </p:panelGrid>
                <g:botones_top modelo="#{personaModel}" formId="Persona"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
