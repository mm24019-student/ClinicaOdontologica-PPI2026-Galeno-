<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/general.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud">



    <ui:define name="titulo_pagina">
        <h2>Procedimiento</h2>
    </ui:define>


    <!--Trozo de codigo de contenido de la pagina donde se muestra la tabla de procedimientos -->
    <ui:define name="contenido">
        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{procedimientoModel}" var="r" id="tblProcedimiento"
                             paginator="true" rows="10" style="width:100%"
                             selectionMode="single" rowKey="#{r.idProcedimiento}"
                             rendered="#{procedimientoModel.estado=='NINGUNO'}">
                    <p:ajax event="rowSelect" listener="#{procedimientoModel.onRowSelect}"
                            update=":frmTabla :Procedimiento :mensajes"/>
                    <p:column headerText="Nombre">
                        <p:outputLabel value="#{r.nombre}"/>
                    </p:column>
                    <p:column headerText="Estado">
                        <p:outputLabel value="#{r.activo?'ACTIVO':'INACTIVO'}"/>
                    </p:column>
                    <p:column headerText="Observaciones">
                        <p:outputLabel value="#{r.observaciones}"/>
                    </p:column>
                </p:dataTable>
                <g:Botones_Acciones modelo="#{procedimientoModel}" update="@form :Procedimiento :mensajes"/>
            </h:form>
        </div>

        <!--Mensaje de confirmación -->
        <div class="mensajes">
            <p:messages id="mensajes" globalOnly="false" showDetail="true" showSummary="false" closable="true"/>
        </div>
        <!--Trozo de codigo que muestra el formulario de mantenimiento de procedimientos, con pestañas -->
        <div class="tarjeta-suelta">
            <h2>Mantenimiento Procedimiento</h2>
            <h:form id="Procedimiento" styleClass="form-procedimiento">

                <p:tabView id="tabsProcedimiento"  binding="#{procedimientoModel.tabView}" activeIndex="#{procedimientoModel.activo}" rendered="#{procedimientoModel.estado!='NINGUNO'}">

                    <!-- El evento tabChange tiene que ir en el p:tabView, no dentro de un p:tab suelto -->
                    <p:ajax event="tabChange" listener="#{procedimientoPasoModel.cargarDe(procedimientoModel.registro)}"
                            update=":Procedimiento:tabsProcedimiento:pnlPasos"/>

                    <!-- Pestaña 1: datos propios del procedimiento -->
                    <p:tab title="Datos del procedimiento">
                        <p:panelGrid columns="2">
                            <p:outputLabel value="IDProcedimiento" for="txtIdProcedimiento"/>
                            <p:inputText id="txtIdProcedimiento" disabled="true" size="70" value="#{procedimientoModel.registro.idProcedimiento}"/>
                            <p:outputLabel value="Nombre" for="txtNombre"/>
                            <p:inputText id="txtNombre" size="70" disabled="#{procedimientoModel.estado=='MODIFICAR'}" value="#{procedimientoModel.registro.nombre}"/>
                            <p:outputLabel for="chkActivo" value="Activo"/>
                            <p:selectBooleanCheckbox id="chkActivo" value="#{procedimientoModel.registro.activo}"/>
                            <p:outputLabel for="txtObservaciones" value="Observaciones"/>
                            <p:inputTextarea id="txtObservaciones" rows="3" cols="70" value="#{procedimientoModel.registro.observaciones}"/>
                        </p:panelGrid>
                        <h:panelGroup rendered="#{procedimientoModel.estado=='CREAR'}" layout="block"
                                      style="padding:10px; margin-top:10px; border-radius:4px; background:#e7f3fe; color:#1a5fa4;">
                            Guarda primero los datos del procedimiento para poder acceder a las demas funciones.
                        </h:panelGroup>
                        <!--Botones de acción del formulario de mantenimiento -->
                        <g:botones_top modelo="#{procedimientoModel}"/>
                    </p:tab>

                    <!-- Pestaña 2: pasos de ESTE procedimiento. Solo tiene sentido
                         una vez que el procedimiento ya está guardado (MODIFICAR),
                         porque un paso necesita un procedimiento ya existente. -->
                    <p:tab title="Pasos del Procedimiento" disabled="#{procedimientoModel.estado!='MODIFICAR'}">

                        <h:panelGroup id="pnlPasos">
                            <p:treeTable value="#{procedimientoPasoModel.raiz}" var="ps" id="tblPasos"
                                         selectionMode="single" selection="#{procedimientoPasoModel.nodoSeleccionado}"
                                         style="width:100%"
                                         rendered="#{procedimientoPasoModel.estado=='NINGUNO'}">
                                <p:ajax event="select" listener="#{procedimientoPasoModel.onNodeSelect}"
                                        update="@form" resetValues="true"/>
                                <p:column headerText="Nombre"><p:outputLabel value="#{ps.nombre}"/></p:column>
                                <p:column headerText="Rol"><p:outputLabel value="#{ps.idRol.nombre}"/></p:column>
                                <p:column headerText="Depende de"><p:outputLabel value="#{procedimientoPasoModel.textoDependeDe(ps)}"/></p:column>
                                <p:column headerText="Fin"><p:outputLabel value="#{ps.indicaFin ? 'SÍ' : 'NO'}"/></p:column>
                            </p:treeTable>

                            <g:Botones_Acciones modelo="#{procedimientoPasoModel}" update="@form" 
                                                mostrarCancelar="false" rendered="#{procedimientoPasoModel.estado=='NINGUNO'}"/>


                            <h:panelGroup layout="block" rendered="#{procedimientoPasoModel.estado!='NINGUNO'}"
                                          style="display:flex; gap:30px; align-items:flex-start; margin-bottom:20px;">

                                <!-- 7 partes: formulario del paso -->
                                <div style="flex:7; min-width:0; overflow:hidden;">
                                    <p:panelGrid columns="2" layout="grid" columnClasses="ui-g-5,ui-g-7" style="width:100%; border:none;">
                                        <p:outputLabel value="IDPaso" for="txtIdPaso"/>
                                        <p:inputText id="txtIdPaso" style="width:100%" disabled="true" value="#{procedimientoPasoModel.registro.idProcedimientoPaso}"/>
                                        <p:outputLabel value="Nombre" for="txtNombrePaso"/>
                                        <p:inputText id="txtNombrePaso" size="50" disabled="#{procedimientoPasoModel.estado=='MODIFICAR'}" value="#{procedimientoPasoModel.registro.nombre}"/>
                                        <p:outputLabel value="Rol" for="acRol"/>
                                        <p:autoComplete id="acRol" disabled="#{procedimientoPasoModel.estado=='MODIFICAR'}" value="#{procedimientoPasoModel.registro.idRol}" completeMethod="#{procedimientoPasoModel.completarRoles}"
                                                        var="ro" itemValue="#{ro}" itemLabel="#{ro.nombre}" converter="rolConverter" forceSelection="true" placeholder="Buscar rol..." style="width:100%;">
                                        </p:autoComplete>
                                        <p:outputLabel value="Depende de" for="txtDepende"/>
                                        <p:inputText id="txtDepende" size="50" disabled="true" value="#{procedimientoPasoModel.textoDependeDe}"/>
                                        <p:outputLabel value="Indica fin" for="chkFin"/>
                                        <p:selectBooleanCheckbox id="chkFin" value="#{procedimientoPasoModel.registro.indicaFin}"/>
                                    </p:panelGrid>
                                </div>

                                <!-- 3 partes: espacio libre para lo nuevo -->
                                <div style="flex:3; min-width:0; padding-top:8px;">
                                    <p:panel header="Gestionar Examen">
                                        <div style="display:flex; gap:10px; align-items:flex-start;">

                                            <!-- Izquierda: PANEL con los exámenes ya creados para este paso.
                                                 examenesDe(paso) los carga solo al seleccionar el paso. -->
                                            <h:panelGroup id="pnlExamenes" layout="block" style="flex:1; min-width:0;">
                                                <p:dataTable value="#{procedimientoPasoExamenModel.examenesDe(procedimientoPasoModel.registro)}"
                                                             var="pe" id="tblExamenesPaso"
                                                             paginator="true" rows="5" style="width:100%"
                                                             selectionMode="single" rowKey="#{pe.idProcedimientoPasoExamen}"
                                                             emptyMessage="Este paso aún no tiene exámenes">
                                                    <p:ajax event="rowSelect" listener="#{procedimientoPasoExamenModel.onRowSelectAbrir}"
                                                            update="@form"/>
                                                    <p:column headerText="Examen">
                                                        <p:outputLabel value="#{pe.idExamen.nombre}"/>
                                                    </p:column>
                                                    <p:column headerText="Estado">
                                                        <p:outputLabel value="#{pe.activo ? 'ACTIVO' : 'INACTIVO'}"/>
                                                    </p:column>
                                                </p:dataTable>
                                            </h:panelGroup>

                                            <!-- Derecha: BOTÓN que abre el diálogo con el formulario de
                                                 ProcedimientoPasoExamen. Solo se habilita con el paso ya
                                                 guardado (estado MODIFICAR). -->
                                            <p:commandButton id="btnNuevoExamen" icon="pi pi-plus" title="Nuevo examen"
                                                             process="@this" resetValues="true"
                                                             disabled="#{procedimientoPasoModel.estado!='MODIFICAR'}"
                                                             actionListener="#{procedimientoPasoExamenModel.abrirNuevoExamen(procedimientoPasoModel.registro)}"
                                                             update="@form :mensajes"/>
                                        </div>
                                    </p:panel>
                                </div>

                            </h:panelGroup>
                            <div class="pasos-botones" style="display:flex; align-items:center; gap:10px;">
                                <g:botones_top modelo="#{procedimientoPasoModel}" tabla="Procedimiento:tabsProcedimiento:pnlPasos"
                                               rendered="#{procedimientoPasoModel.estado!='NINGUNO'}"/>

                                <g:Botones_Acciones modelo="#{procedimientoPasoModel}" update="@form"
                                                    mostrarNuevo="false" rendered="#{procedimientoPasoModel.estado!='NINGUNO'}" />
                            </div>
                        </h:panelGroup>

                    </p:tab>

                </p:tabView>
                <!-- Diálogos movidos fuera de pnlPasos para que no se destruyan y regeneren
     en cada ajax update — evita que queden copias huérfanas en el <body> -->


                <p:dialog id="dlgExamen" header="Procedimiento del Examen" widgetVar="dlgExamen"
                          modal="true" width="650" style="max-width:95vw"
                          visible="#{procedimientoPasoExamenModel.mostrarDialogo}">

                    <p:ajax event="close" listener="#{procedimientoPasoExamenModel.btnCerrarDialogo}"
                            update="@form" resetValues="true"/>

                    <p:outputLabel value="Buscar examen existente" style="font-weight:bold;"
                                   rendered="#{procedimientoPasoExamenModel.estado=='NINGUNO'}"/>
                    <div style="display:flex; gap:2px; align-items:flex-start; width:80%; box-sizing:border-box;">
                        <p:autoComplete id="acExamenes" style="flex:1 1 auto; width:1%; min-width:0;"
                                        value="#{procedimientoPasoExamenModel.seleccionAutocomplete}"
                                        completeMethod="#{procedimientoPasoExamenModel.completarExamenes}"
                                        var="pe" itemValue="#{pe}"
                                        itemLabel="#{procedimientoPasoExamenModel.etiqueta(pe)}"
                                        converter="procedimientoPasoExamenConverter" forceSelection="true"
                                        scrollHeight="220"
                                        emptyMessage="No hay exámenes que coincidan"
                                        placeholder="Escriba el nombre del examen o el estado..."
                                        rendered="#{procedimientoPasoExamenModel.estado=='NINGUNO'}">
                            <p:ajax event="itemSelect" listener="#{procedimientoPasoExamenModel.onItemSelect}"
                                    process="@this" update="@form"/>
                        </p:autoComplete>
                        <g:Botones_Acciones modelo="#{procedimientoPasoExamenModel}" update="@form"
                                            mostrarCancelar="false" rendered="#{procedimientoPasoExamenModel.estado=='NINGUNO'}" />
                    </div>



                    <p:panelGrid columns="2" style="width:100%; table-layout:fixed;"
                                 columnClasses="ui-grid-col-4,ui-grid-col-8"
                                 rendered="#{procedimientoPasoExamenModel.estado!='NINGUNO'}">
                        <p:outputLabel value="Examen *" for="selExamen"/>
                        <p:autoComplete id="selExamen" required="true" requiredMessage="Debe seleccionar un Examen"
                                        value="#{procedimientoPasoExamenModel.registro.idExamen}"
                                        completeMethod="#{procedimientoPasoExamenModel.completarExamenesFormulario}"
                                        var="e" itemValue="#{e}" disabled="#{procedimientoPasoExamenModel.estado=='MODIFICAR'}" itemLabel="#{e.nombre}" converter="#{examenConverter}" forceSelection="true" placeholder="Buscar examen..." style="width:100%;">
                            <p:ajax event="itemSelect" update="txtDescExamen"/>
                        </p:autoComplete>

                        <p:outputLabel value="Descripción del examen"/>
                        <h:outputText id="txtDescExamen" value="#{procedimientoPasoExamenModel.registro.idExamen.observaciones}"/>

                        <p:outputLabel for="chkActivoExamen" value="Activo"/>
                        <p:selectBooleanCheckbox id="chkActivoExamen" value="#{procedimientoPasoExamenModel.registro.activo}"/>

                        <p:outputLabel value="Fecha de creación" for="calFecha"/>
                        <p:datePicker id="calFecha" showTime="true" pattern="dd/MM/yyyy HH:mm"
                                      value="#{procedimientoPasoExamenModel.registro.fechaCreacion}"/>

                        <p:outputLabel value="Observaciones" for="txtObsExamen"/>
                        <p:inputTextarea id="txtObsExamen" disabled="#{procedimientoPasoExamenModel.estado=='MODIFICAR'}" rows="3" cols="50" style="width:100%; box-sizing:border-box;"
                                         value="#{procedimientoPasoExamenModel.registro.observaciones}"/>
                    </p:panelGrid>

                    <div class="pasos-botones" style="display:flex; align-items:center; gap:10px;">
                        <g:botones_top modelo="#{procedimientoPasoExamenModel}"
                                       tabla="Procedimiento:tabsProcedimiento:pnlPasos"
                                       process="@form"
                                       rendered="#{procedimientoPasoExamenModel.estado!='NINGUNO'}"/>
                    </div>
                </p:dialog>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
