<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/general.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud">



    <ui:define name="titulo_pagina">
        <h2>Procedimiento</h2>
    </ui:define>


    <!--Trozo de codigo de contenido de la pagina donde se muestra la tabla de procedimientos -->
    <ui:define name="contenido">
        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{procedimientoModel}" var="r" id="tblProcedimiento"
                             paginator="true" rows="10" style="width:100%"
                             selectionMode="single" rowKey="#{r.idProcedimiento}"
                             rendered="#{procedimientoModel.estado=='NINGUNO'}">
                    <p:ajax event="rowSelect" listener="#{procedimientoModel.onRowSelect}"
                            update="@form :frmTabla :Procedimiento :mensajes :growlGlobal"/>
                    <p:column headerText="ID">
                        <p:outputLabel value="#{r.idProcedimiento}" />
                    </p:column>
                    <p:column headerText="Nombre">
                        <p:outputLabel value="#{r.nombre}"/>
                    </p:column>
                    <p:column headerText="Estado">
                        <p:outputLabel value="#{r.activo?'ACTIVO':'INACTIVO'}"/>
                    </p:column>
                    <p:column headerText="Observaciones">
                        <p:outputLabel value="#{r.observaciones}"/>
                    </p:column>
                </p:dataTable>
                <g:Botones_Acciones modelo="#{procedimientoModel}" update="@form :frmTabla :Procedimiento :mensajes :growlGlobal"/>
            </h:form>
        </div>

        <!--Mensaje de confirmación -->
        <div class="mensajes">
            <p:messages id="mensajes" globalOnly="false" showDetail="true" showSummary="false" closable="true"/>
        </div>
        <!--Trozo de codigo que muestra el formulario de mantenimiento de procedimientos, con pestañas -->
        <div class="tarjeta-suelta">
            <h2>Mantenimiento Procedimiento</h2>
            <h:form id="Procedimiento" styleClass="form-procedimiento">

                <p:tabView id="tabsProcedimiento"  binding="#{procedimientoModel.tabView}" activeIndex="#{procedimientoModel.activo}" rendered="#{procedimientoModel.estado!='NINGUNO'}">

                    <!-- El evento tabChange tiene que ir en el p:tabView, no dentro de un p:tab suelto -->
                    <p:ajax event="tabChange" listener="#{procedimientoPasoModel.cargarDe(procedimientoModel.registro)}"
                            update=":Procedimiento:tabsProcedimiento:pnlPasos"/>

                    <!-- Pestaña 1: datos propios del procedimiento -->
                    <p:tab title="Datos del procedimiento">
                        <p:panelGrid columns="2">
                            <p:outputLabel value="IDProcedimiento" for="txtIdProcedimiento"/>
                            <p:inputText id="txtIdProcedimiento" disabled="true" style="width:100%" value="#{procedimientoModel.registro.idProcedimiento}"/>
                            <p:outputLabel value="Nombre" for="txtNombre"/>
                            <p:inputText id="txtNombre" style="width:100%" disabled="#{procedimientoModel.estado=='MODIFICAR'}" value="#{procedimientoModel.registro.nombre}"/>
                            <p:outputLabel for="chkActivo" value="Activo"/>
                            <p:selectBooleanCheckbox id="chkActivo" style="width:100%" value="#{procedimientoModel.registro.activo}"/>
                            <p:outputLabel for="txtObservaciones" value="Observaciones"/>
                            <p:inputTextarea id="txtObservaciones" rows="3" style="width:100%" value="#{procedimientoModel.registro.observaciones}"/>
                        </p:panelGrid>
                        <h:panelGroup rendered="#{procedimientoModel.estado=='CREAR'}" layout="block"
                                      style="padding:10px; margin-top:10px; border-radius:4px; background:#e7f3fe; color:#1a5fa4;">
                            Guarda primero los datos del procedimiento para poder acceder a las demas funciones.
                        </h:panelGroup>
                        <!--Botones de acción del formulario de mantenimiento -->
                        <g:botones_top modelo="#{procedimientoModel}"/>
                    </p:tab>

                    <!-- Pestaña 2: pasos de ESTE procedimiento. Solo tiene sentido
                         una vez que el procedimiento ya está guardado (MODIFICAR),
                         porque un paso necesita un procedimiento ya existente. -->
                    <p:tab title="Pasos del Procedimiento" disabled="#{procedimientoModel.estado!='MODIFICAR'}">

                        <h:panelGroup id="pnlPasos">
                            <p:treeTable value="#{procedimientoPasoModel.raiz}" var="ps" id="tblPasos"
                                         selectionMode="single" selection="#{procedimientoPasoModel.nodoSeleccionado}"
                                         style="width:100%"
                                         rendered="#{procedimientoPasoModel.estado=='NINGUNO'}">
                                <p:ajax event="select" listener="#{procedimientoPasoModel.onNodeSelect}"
                                        update="@form" resetValues="true"/>
                                <p:column headerText="Nombre"><p:outputLabel value="#{ps.nombre}"/></p:column>
                                <p:column headerText="ID"><p:outputLabel value="#{ps.idProcedimientoPaso}"/></p:column>
                                <p:column headerText="A cargo de"><p:outputLabel value="#{ps.idRol.nombre}"/></p:column>
                                <p:column headerText="Depende de"><p:outputLabel value="#{procedimientoPasoModel.textoDependeDe(ps)}"/></p:column>
                                <p:column headerText="Fin"><p:outputLabel value="#{ps.indicaFin ? 'SÍ' : 'NO'}"/></p:column>
                            </p:treeTable>

                            <g:Botones_Acciones modelo="#{procedimientoPasoModel}" update="@form :mensajes :growlGlobal"
                                                etiquetaNuevo="#{procedimientoPasoModel.hayPasos ? msg['crud.boton.nuevoPasoDependiente'] : msg['crud.boton.nuevoPaso']}"
                                                mostrarCancelar="false"
                                                rendered="#{procedimientoPasoModel.estado=='NINGUNO'}"/>
                        

                        <h:panelGroup layout="block" rendered="#{procedimientoPasoModel.estado!='NINGUNO'}"
                                      style="display:flex; gap:30px; align-items:flex-start; margin-bottom:20px;">

                            <!-- 7 partes: formulario del paso -->
                            <div style="flex:7; min-width:0; overflow:hidden;">
                                <p:panelGrid columns="2" layout="grid" columnClasses="ui-g-5,ui-g-7" style="width:100%; border:none;">
                                    <p:outputLabel value="ID" for="txtIdPaso"/>
                                    <p:inputText id="txtIdPaso" style="width:100%" disabled="true" value="#{procedimientoPasoModel.registro.idProcedimientoPaso}"/>
                                    <p:outputLabel value="Nombre" for="txtNombrePaso"/>
                                    <p:inputText id="txtNombrePaso" style="width:100%" disabled="#{procedimientoPasoModel.estado=='MODIFICAR'}" value="#{procedimientoPasoModel.registro.nombre}"/>
                                    <p:outputLabel value="A cargo de" for="acRol"/>
                                    <p:autoComplete id="acRol" disabled="#{procedimientoPasoModel.estado=='MODIFICAR'}" value="#{procedimientoPasoModel.registro.idRol}" completeMethod="#{procedimientoPasoModel.completarRoles}"
                                                    var="ro" itemValue="#{ro}" itemLabel="#{ro.nombre}" converter="rolConverter" forceSelection="true" placeholder="Buscar rol..." style="width:100%;">
                                    </p:autoComplete>
                                    <p:outputLabel value="Depende de" for="txtDepende"/>
                                    <p:inputText id="txtDepende" style="width:100%" disabled="true" value="#{procedimientoPasoModel.textoDependeDe}"/>
                                    <p:outputLabel value="Indica fin" for="chkFin"/>
                                    <p:selectBooleanCheckbox id="chkFin" style="width:100%" value="#{procedimientoPasoModel.registro.indicaFin}"/>
                                </p:panelGrid>
                            </div>

                            <!-- 3 partes: espacio libre para lo nuevo -->
                            <!-- 3 partes: Gestionar Examen -->
                            <div style="flex:3; min-width:0; padding-top:8px;">
                                <p:panel header="Gestionar Examen">
                                    <h:panelGroup id="pnlExamenes" layout="block">

                                        <div style="display:flex; gap:10px; align-items:flex-start; margin-top:10px;">
                                            <p:selectOneListbox id="lstExamenes" style="flex:1; min-width:0; height:130px;"
                                                                value="#{procedimientoPasoExamenModel.idSeleccionado}">
                                                <f:selectItems value="#{procedimientoPasoExamenModel.examenesDe(procedimientoPasoModel.registro)}"
                                                               var="pe" itemValue="#{pe.idProcedimientoPasoExamen.toString()}"
                                                               itemLabel="#{procedimientoPasoExamenModel.etiquetaLista(pe)}"/>
                                            </p:selectOneListbox>

                                            <div style="display:flex; flex-direction:column; gap:8px;">
                                                <p:commandButton value="Agregar Examen" process="@this"
                                                                 disabled="#{procedimientoPasoModel.estado!='MODIFICAR'}"
                                                                 actionListener="#{procedimientoPasoExamenModel.prepararAgregar}"
                                                                 update="pnlDialogoExamen"
                                                                 oncomplete="PF('dlgAgregarExamen').show()"/>
                                                <p:commandButton value="Eliminar Seleccionado" process="lstExamenes @this"
                                                                 disabled="#{procedimientoPasoModel.estado!='MODIFICAR'}"
                                                                 actionListener="#{procedimientoPasoExamenModel.eliminarSeleccionado(procedimientoPasoModel.registro)}"
                                                                 update="@form :mensajes :growlGlobal"/>
                                            </div>
                                        </div>
                                    </h:panelGroup>
                                </p:panel>
                            </div>

                        </h:panelGroup>
                        <div class="pasos-botones" style="display:flex; align-items:center; gap:10px;">
                            <g:botones_top modelo="#{procedimientoPasoModel}" tabla="Procedimiento:tabsProcedimiento:pnlPasos"
                                           rendered="#{procedimientoPasoModel.estado!='NINGUNO'}"/>

                            <g:Botones_Acciones modelo="#{procedimientoPasoModel}" update="@form"
                                                mostrarNuevo="false" rendered="#{procedimientoPasoModel.estado!='NINGUNO'}" />
                        </div>
                        </h:panelGroup>

                    </p:tab>

                </p:tabView>

                <!-- DIÁLOGO: AGREGAR EXAMEN AL PASO (examen + observaciones) -->
                <p:dialog id="dlgAgregarExamen" widgetVar="dlgAgregarExamen" header="Agregar Examen"
                          modal="true" width="520" resizable="false" style="max-width:95vw">
                    <h:panelGroup id="pnlDialogoExamen" layout="block">
                        <p:messages id="msgDialogoExamen" globalOnly="false" showDetail="true" showSummary="false" closable="true"/>
                        <p:panelGrid columns="2" style="border:none; width:100%;">
                            <p:outputLabel for="acExamen" value="Examen"/>
                            <p:autoComplete id="acExamen" value="#{procedimientoPasoExamenModel.examenPorAgregar}"
                                            completeMethod="#{procedimientoPasoExamenModel.completarExamenesFormulario}"
                                            var="e" itemValue="#{e}" itemLabel="#{e.nombre}"
                                            converter="#{examenConverter}" forceSelection="true"
                                            placeholder="Buscar examen..." style="width:100%;"/>
                            <p:outputLabel for="txtObsExamen" value="Observaciones"/>
                            <p:inputTextarea id="txtObsExamen" rows="3" style="width:100%;"
                                             value="#{procedimientoPasoExamenModel.observacionesPorAgregar}"/>
                        </p:panelGrid>
                        <p:commandButton value="Seleccionar" process="@this acExamen txtObsExamen"
                                         actionListener="#{procedimientoPasoExamenModel.agregarExamen(procedimientoPasoModel.registro)}"
                                         update="@form :mensajes :growlGlobal"/>
                    </h:panelGroup>
                </p:dialog>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
