<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/general.xhtml"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:g="jakarta.faces.composite/crud">

    <ui:define name="titulo_pagina"><h2>Secuencia de Pasos</h2></ui:define>

    <ui:define name="contenido">
        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{procedimientoPasoSecuenciaModel}" var="r" id="tblSecuencia"
                             paginator="true" rows="10" style="width:100%"
                             selectionMode="single" rowKey="#{r.idProcedimientoPasoSecuencia}"
                             rendered="#{procedimientoPasoSecuenciaModel.estado=='NINGUNO'}">
                    <p:ajax event="rowSelect" listener="#{procedimientoPasoSecuenciaModel.onRowSelect}"
                            update=":frmTabla :ProcedimientoPasoSecuencia :mensajes"/>
                    <p:column headerText="Paso"><p:outputLabel value="#{r.idProcedimientoPaso.nombre}"/></p:column>
                    <p:column headerText="Tipo"><p:outputLabel value="#{r.tipoSecuencia}"/></p:column>
                    <p:column headerText="Paso de referencia">
                        <p:outputLabel value="#{procedimientoPasoSecuenciaModel.nombrePaso(r.idProcedimientoPasoReferencia)}"/>
                    </p:column>
                </p:dataTable>
                <p:commandButton value="#{msg['crud.boton.nuevo']}"
                                 actionListener="#{procedimientoPasoSecuenciaModel.btnNuevoHandler}"
                                 rendered="#{procedimientoPasoSecuenciaModel.estado=='NINGUNO'}"
                                 process="@this" update=":frmTabla :ProcedimientoPasoSecuencia"/>
            </h:form>
        </div>

        <div class="mensajes">
            <p:messages id="mensajes" globalOnly="false" showDetail="true" closable="true"/>
        </div>

        <div class="tarjeta-suelta">
            <h2>Mantenimiento de Secuencia</h2>
            <h:form id="ProcedimientoPasoSecuencia">
                <p:panelGrid id="pnlDatos" columns="2"
                             rendered="#{procedimientoPasoSecuenciaModel.estado!='NINGUNO'}">

                    <p:outputLabel value="Paso" for="cmbPaso"/>
                    <p:selectOneMenu id="cmbPaso" converter="procedimientoPasoConverter"
                                     value="#{procedimientoPasoSecuenciaModel.registro.idProcedimientoPaso}">
                        <f:selectItem itemLabel="Seleccione..." noSelectionOption="true"/>
                        <f:selectItems value="#{procedimientoPasoSecuenciaModel.pasos}" var="pa"
                                       itemValue="#{pa}"
                                       itemLabel="#{pa.idProcedimiento.nombre} - #{pa.nombre}"/>
                    </p:selectOneMenu>

                    <p:outputLabel value="Tipo de secuencia" for="txtTipo"/>
                    <p:inputText id="txtTipo" maxlength="20"
                                 value="#{procedimientoPasoSecuenciaModel.registro.tipoSecuencia}"/>

                    <p:outputLabel value="Paso de referencia" for="cmbReferencia"/>
                    <p:selectOneMenu id="cmbReferencia"
                                     value="#{procedimientoPasoSecuenciaModel.registro.idProcedimientoPasoReferencia}">
                        <f:selectItem itemLabel="Seleccione..." noSelectionOption="true"/>
                        <f:selectItems value="#{procedimientoPasoSecuenciaModel.pasos}" var="pa"
                                       itemValue="#{pa.idProcedimientoPaso}"
                                       itemLabel="#{pa.idProcedimiento.nombre} - #{pa.nombre}"/>
                    </p:selectOneMenu>
                </p:panelGrid>
                <g:botones_top modelo="#{procedimientoPasoSecuenciaModel}"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
