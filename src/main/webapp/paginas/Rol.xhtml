<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<!-- Página CRUD de Rol -->
<ui:composition template="/WEB-INF/general.xhtml"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:g="jakarta.faces.composite/crud">

    <ui:define name="titulo_pagina">
        <h2>Rol</h2>
    </ui:define>

    <ui:define name="contenido">

        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{rolModel}" var="r" id="tblRol"
                             paginator="true" rows="10" style="width:100%"
                             selectionMode="single" rowKey="#{r.idRol}"
                             rendered="#{rolModel.estado=='NINGUNO'}">
                    <p:ajax event="rowSelect" listener="#{rolModel.onRowSelect}"
                            update=":frmTabla :Rol :mensajes" resetValues="true"/>
                    <p:column headerText="Nombre">
                        <p:outputLabel value="#{r.nombre}"/>
                    </p:column>
                    <p:column headerText="Observaciones">
                        <p:outputLabel value="#{r.observaciones}"/>
                    </p:column>
                    <p:column headerText="Estado">
                        <p:outputLabel value="#{r.activo?'ACTIVO':'INACTIVO'}"/>
                    </p:column>
                </p:dataTable>

                <p:commandButton value="#{msg['crud.boton.nuevo']}" style="margin-right:10px;" resetValues="true"
                                 actionListener="#{rolModel.btnNuevoHandler}"
                                 update=":frmTabla :Rol :mensajes"/>
                <p:commandButton value="#{msg['crud.boton.cancelar']}" resetValues="true"
                                 actionListener="#{rolModel.btnCancelar}"
                                 update=":frmTabla :Rol :mensajes"/>
            </h:form>
        </div>

        <div class="mensajes">
            <p:messages id="mensajes" globalOnly="false" showDetail="true" showSummary="true"
                        closable="true"/>
        </div>

        <div class="tarjeta-suelta">
            <h2>Mantenimiento de Rol</h2>
            <h:form id="Rol" styleClass="form-rol">
                <p:panelGrid columns="2" style="width:100%" rendered="#{rolModel.estado!='NINGUNO'}">
                    <p:outputLabel value="ID" for="txtId"/>
                    <p:inputText id="txtId" style="width:100%" disabled="true" value="#{rolModel.registro.idRol}"/>
                    <p:outputLabel value="Nombre" for="txtNombre"/>
                    <p:inputText id="txtNombre" style="width:100%" value="#{rolModel.registro.nombre}"/>
                    <p:outputLabel for="txtObservaciones" value="Observaciones"/>
                    <p:inputTextarea id="txtObservaciones" rows="3" style="width:100%" value="#{rolModel.registro.observaciones}"/>
                    <p:outputLabel for="chkActivo" value="Activo"/>
                    <p:selectBooleanCheckbox id="chkActivo" value="#{rolModel.registro.activo}"/>
                </p:panelGrid>
                <g:botones_top modelo="#{rolModel}" formId="Rol"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
