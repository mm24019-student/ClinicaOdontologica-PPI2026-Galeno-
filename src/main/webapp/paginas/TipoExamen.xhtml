<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/general.xhtml"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:g="jakarta.faces.composite/crud">

    <ui:define name="titulo_pagina">
        <h2>Tipo Examen</h2>
    </ui:define>

    <ui:define name="contenido">
        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{tipoExamenModel}" var="r" id="tblTipoExamen"
                             paginator="true" rows="10" style="width:100%"
                             selectionMode="single" rowKey="#{r.idTipoExamen}"
                             rendered="#{tipoExamenModel.estado=='NINGUNO'}">
                    <p:ajax event="rowSelect" listener="#{tipoExamenModel.onRowSelect}"
                            update=":frmTabla :TipoExamen :mensajes"/>
                    <p:column headerText="ID">
                        <p:outputLabel value="#{r.idTipoExamen}" />
                    </p:column>
                    <p:column headerText="Nombre">
                        <p:outputLabel value="#{r.nombre}"/>
                    </p:column>
                    <p:column headerText="Estado">
                        <p:outputLabel value="#{r.activo?'ACTIVO':'INACTIVO'}"/>
                    </p:column>
                    <p:column headerText="Observaciones">
                        <p:outputLabel value="#{r.observaciones}"/>
                    </p:column>
                </p:dataTable>
                <p:commandButton value="#{msg['crud.boton.nuevo']}" actionListener="#{tipoExamenModel.btnNuevoHandler}"
                                 update=":frmTabla :TipoExamen :mensajes"/>
                <p:commandButton value="#{msg['crud.boton.cancelar']}" actionListener="#{tipoExamenModel.btnCancelar()}"
                                 update=":frmTabla :TipoExamen :mensajes"/>
            </h:form>
        </div>

        <div class="mensajes">
            <p:messages id="mensajes" globalOnly="false" showDetail="true" showSummary="true"
                        closable="true"/>
        </div>

        <div class="tarjeta-suelta">
            <h2>Mantenimiento Tipo de Examen</h2>
            <h:form id="TipoExamen" styleClass="form-tipo-examen">
                <p:panelGrid columns="2" rendered="#{tipoExamenModel.estado!='NINGUNO'}">
                    <p:outputLabel value="ID" for="txtId"/>
                    <p:inputText id="txtId" size="70" value="#{tipoExamenModel.registro.idTipoExamen}"/>
                    <p:outputLabel value="Nombre" for="txtNombre"/>
                    <p:inputText id="txtNombre" size="70" value="#{tipoExamenModel.registro.nombre}"/>
                    <p:outputLabel for="chkActivo" value="Activo"/>
                    <p:selectBooleanCheckbox id="chkActivo" value="#{tipoExamenModel.registro.activo}"/>
                    <p:outputLabel for="txtObservaciones" value="Observaciones"/>
                    <p:inputTextarea id="txtObservaciones" rows="3" cols="70" value="#{tipoExamenModel.registro.observaciones}"/>
                </p:panelGrid>
                <g:botones_top modelo="#{tipoExamenModel}" formId="TipoExamen"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
