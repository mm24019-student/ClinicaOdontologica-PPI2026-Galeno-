<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/general.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:g="jakarta.faces.composite/crud">

    <ui:define name="titulo_pagina">
        <h2>Tipo Medio de Contacto</h2>
    </ui:define>

    <ui:define name="contenido">
        <div class="tarjeta">
            <h:form id="frmTabla">
                <p:dataTable value="#{tipoMedioContactoModel}" var="r" id="tblTipoMedioContacto"
                             paginator="true" rows="10" style="width:100%"
                             selectionMode="single" rowKey="#{r.idTipoMedioContacto}"
                             rendered="#{tipoMedioContactoModel.estado=='NINGUNO'}">
                    <p:ajax event="rowSelect" listener="#{tipoMedioContactoModel.onRowSelect}"
                            update=":frmTabla :TipoMedioContacto :mensajes"/>
                    <p:column headerText="ID">
                        <p:outputLabel value="#{r.idTipoMedioContacto}" />
                    </p:column>
                    <p:column headerText="Nombre">
                        <p:outputLabel value="#{r.nombre}"/>
                    </p:column>
                    <p:column headerText="Indicaciones">
                        <p:outputLabel value="#{r.indicaciones}"/>
                    </p:column>
                    <p:column headerText="Estado">
                        <p:outputLabel value="#{r.activo?'ACTIVO':'INACTIVO'}"/>
                    </p:column>
                </p:dataTable>
                <p:commandButton value="#{msg['crud.boton.nuevo']}" style="margin-right:10px;" resetValues="true" actionListener="#{tipoMedioContactoModel.btnNuevoHandler}"
                                 update=":frmTabla :TipoMedioContacto :mensajes"/>
                <p:commandButton value="#{msg['crud.boton.cancelar']}" resetValues="true" actionListener="#{tipoMedioContactoModel.btnCancelar}"
                                 update=":frmTabla :TipoMedioContacto :mensajes"/>
            </h:form>
        </div>

        <div class="mensajes">
            <p:messages id="mensajes" globalOnly="false" showDetail="true" showSummary="true"
                        closable="true"/>
        </div>

        <div class="tarjeta-suelta">
            <h2>Mantenimiento Tipo de Medio de Contacto</h2>
            <h:form id="TipoMedioContacto" styleClass="form-tipo-medio-contacto">
                <p:panelGrid columns="2" style="width:100%" columnClasses="col-label,col-input" rendered="#{tipoMedioContactoModel.estado!='NINGUNO'}">
                    <p:outputLabel value="ID" for="txtId"/>
                    <p:inputText id="txtId" style="width:100%" disabled="true" value="#{tipoMedioContactoModel.registro.idTipoMedioContacto}"/>
                    <p:outputLabel value="Nombre" for="txtNombre"/>
                    <p:inputText id="txtNombre" style="width:100%" value="#{tipoMedioContactoModel.registro.nombre}"/>
                    <p:outputLabel for="txtIndicaciones" value="Indicaciones"/>
                    <p:inputTextarea id="txtIndicaciones" rows="3" style="width:100%" value="#{tipoMedioContactoModel.registro.indicaciones}"/>
                    <p:outputLabel for="txtExpresionRegular" value="Expresión Regular"/>
                    <p:inputText id="txtExpresionRegular" style="width:100%" value="#{tipoMedioContactoModel.registro.expresionRegular}"/>
                    <p:outputLabel for="chkActivo" value="Activo"/>
                    <p:selectBooleanCheckbox id="chkActivo" value="#{tipoMedioContactoModel.registro.activo}"/>
                </p:panelGrid>
                <g:botones_top modelo="#{tipoMedioContactoModel}" formId="TipoMedioContacto"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
