<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<!--
    Composite component reutilizable: agrupa los 3 botones de acción del
    CRUD (Crear / Actualizar / Eliminar) para no repetir este bloque en
    cada página. Cada página que lo use debe pasarle:
      - modelo: el Managed Bean de esa entidad (debe extender AbstracCrudModel)
      - formId: el id del <h:form> de "Mantenimiento" de esa página, para
                que PrimeFaces sepa qué formulario refrescar por AJAX.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:cc="jakarta.faces.composite"
      xmlns:p="primefaces">

    <cc:interface>
        <cc:attribute name="modelo" required="true"/>
        <cc:attribute name="formId" required="true"/>
    </cc:interface>

    <cc:implementation>
        <p:panelGrid columns="3">
            <!-- Solo aparece cuando el modelo está en estado CREAR -->
            <p:commandButton value="#{msg['crud.boton.crear']}" actionListener="#{cc.attrs.modelo.btnCrearhandler}"
                             rendered="#{cc.attrs.modelo.estado=='CREAR'}"
                             update=":frmTabla :mensajes :#{cc.attrs.formId}"/>
            <!-- Solo aparece cuando el modelo está en estado MODIFICAR -->
            <p:commandButton value="#{msg['crud.boton.actualizar']}" actionListener="#{cc.attrs.modelo.btnModificarHandler}"
                             rendered="#{cc.attrs.modelo.estado=='MODIFICAR'}"
                             update=":frmTabla :mensajes :#{cc.attrs.formId}"/>
            <!-- También solo en MODIFICAR: borra el registro seleccionado -->
            <p:commandButton value="#{msg['crud.boton.eliminar']}" actionListener="#{cc.attrs.modelo.btnEliminarHandler}"
                             rendered="#{cc.attrs.modelo.estado=='MODIFICAR'}"
                             update=":frmTabla :mensajes :#{cc.attrs.formId}"/>
        </p:panelGrid>
    </cc:implementation>
</html>
