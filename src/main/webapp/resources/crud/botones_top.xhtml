<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:cc="jakarta.faces.composite"
      xmlns:p="primefaces">

    <cc:interface>
        <cc:attribute name="modelo" required="true"/>
        <cc:attribute name="formulario" default="TipoExamen"/>
    </cc:interface>

    <cc:implementation>
        <p:panelGrid columns="3">
            <p:commandButton value="#{msg['crud.boton.crear']}" actionListener="#{cc.attrs.modelo.btnCrearhandler}"
                             rendered="#{cc.attrs.modelo.estado=='CREAR'}"
                             update=":frmTabla :mensajes :#{cc.attrs.formulario}"/>
            <p:commandButton value="#{msg['crud.boton.actualizar']}" actionListener="#{cc.attrs.modelo.btnModificarHandler}"
                             rendered="#{cc.attrs.modelo.estado=='MODIFICAR'}"
                             update=":frmTabla :mensajes :#{cc.attrs.formulario}"/>
            <p:commandButton value="#{msg['crud.boton.eliminar']}" actionListener="#{cc.attrs.modelo.btnEliminarHandler}"
                             rendered="#{cc.attrs.modelo.estado=='MODIFICAR'}"
                             update=":frmTabla :mensajes :#{cc.attrs.formulario}"/>
        </p:panelGrid>
    </cc:implementation>
</html>
